# Hyprspace trial config translated from ~/.aerospace.toml.
# AeroSpace remains installed and its config is unchanged.

config-version = 2

after-startup-command = [
    'exec-and-forget borders active_color=0xffff9500 inactive_color=0x00000000 width=5.0',
    'exec-and-forget /opt/homebrew/bin/sketchybar --reload',
]

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '/opt/homebrew/bin/sketchybar --trigger hyprspace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Hyprspace is the selected login window manager. Do not run it with AeroSpace.
start-at-login = true
auto-reload-config = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 20
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = [
    '1-q', '2-w', '3-e',
    '4-a', '5-s', '6-d',
    '7-z', '8-x', '9-c',
]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 5
gaps.outer.bottom = 37
gaps.outer.top = 5
gaps.outer.right = 5

# Physical-first workspace layout. Monitor numbers are ordered left to right.
# Switch profiles with service mode + 1 (three across) or 2 (stacked).
# BEGIN managed monitor layout profile
# Active profile: 1 (three across; columns map to monitors)
[workspace-to-monitor-force-assignment]
'1-q' = [1, 'main']
'4-a' = [1, 'main']
'7-z' = [1, 'main']

'2-w' = [2, 'main']
'5-s' = [2, 'main']
'8-x' = [2, 'main']

'3-e' = [3, 'main']
'6-d' = [3, 'main']
'9-c' = [3, 'main']
# END managed monitor layout profile

[mode.main.binding]
    cmd-h = []
    cmd-alt-h = []

    # Reuse the current workspace switcher with the Hyprspace CLI.
    alt-space = '''exec-and-forget env \
        WORKSPACE_MANAGER_CLI=/opt/homebrew/bin/hyprspace \
        /Users/esears/aerospace-workspace-switcher/.build/release/aerospace-workspace-switcher'''

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus windows directionally across monitor boundaries.
    alt-h = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail left || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-left = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail left || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-j = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail down || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-down = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail down || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-k = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail up || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-up = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail up || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-l = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail right || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-right = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail right || true', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-pageDown = ['workspace --wrap-around next', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-pageUp = ['workspace --wrap-around prev', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
    alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
    alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
    alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    # Temporarily maximize the focused window without changing the tiling tree.
    alt-m = 'fullscreen'
    alt-esc = 'fullscreen off'

    # Number-row and letter-grid aliases address the same workspaces.
    alt-1 = ['workspace 1-q', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-2 = ['workspace 2-w', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-3 = ['workspace 3-e', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-4 = ['workspace 4-a', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-5 = ['workspace 5-s', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-6 = ['workspace 6-d', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-7 = ['workspace 7-z', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-8 = ['workspace 8-x', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-9 = ['workspace 9-c', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-q = ['workspace 1-q', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-w = ['workspace 2-w', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-e = ['workspace 3-e', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-a = ['workspace 4-a', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-s = ['workspace 5-s', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-d = ['workspace 6-d', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-z = ['workspace 7-z', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-x = ['workspace 8-x', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-c = ['workspace 9-c', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-shift-1 = ['move-node-to-workspace 1-q', 'workspace 1-q', 'move-mouse window-force-center']
    alt-shift-2 = ['move-node-to-workspace 2-w', 'workspace 2-w', 'move-mouse window-force-center']
    alt-shift-3 = ['move-node-to-workspace 3-e', 'workspace 3-e', 'move-mouse window-force-center']
    alt-shift-4 = ['move-node-to-workspace 4-a', 'workspace 4-a', 'move-mouse window-force-center']
    alt-shift-5 = ['move-node-to-workspace 5-s', 'workspace 5-s', 'move-mouse window-force-center']
    alt-shift-6 = ['move-node-to-workspace 6-d', 'workspace 6-d', 'move-mouse window-force-center']
    alt-shift-7 = ['move-node-to-workspace 7-z', 'workspace 7-z', 'move-mouse window-force-center']
    alt-shift-8 = ['move-node-to-workspace 8-x', 'workspace 8-x', 'move-mouse window-force-center']
    alt-shift-9 = ['move-node-to-workspace 9-c', 'workspace 9-c', 'move-mouse window-force-center']

    alt-shift-q = ['move-node-to-workspace 1-q', 'workspace 1-q', 'move-mouse window-force-center']
    alt-shift-w = ['move-node-to-workspace 2-w', 'workspace 2-w', 'move-mouse window-force-center']
    alt-shift-e = ['move-node-to-workspace 3-e', 'workspace 3-e', 'move-mouse window-force-center']
    alt-shift-a = ['move-node-to-workspace 4-a', 'workspace 4-a', 'move-mouse window-force-center']
    alt-shift-s = ['move-node-to-workspace 5-s', 'workspace 5-s', 'move-mouse window-force-center']
    alt-shift-d = ['move-node-to-workspace 6-d', 'workspace 6-d', 'move-mouse window-force-center']
    alt-shift-z = ['move-node-to-workspace 7-z', 'workspace 7-z', 'move-mouse window-force-center']
    alt-shift-x = ['move-node-to-workspace 8-x', 'workspace 8-x', 'move-mouse window-force-center']
    alt-shift-c = ['move-node-to-workspace 9-c', 'workspace 9-c', 'move-mouse window-force-center']

    alt-tab = ['workspace-back-and-forth', 'move-mouse window-force-center || move-mouse monitor-force-center']

    # Preserved for muscle memory, but this is a no-op while all workspaces are
    # force-assigned above. Use a monitor profile or remove the assignment first.
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    1 = ['exec-and-forget ~/.config/hyprspace/switch-monitor-layout.sh 1', 'mode main']
    2 = ['exec-and-forget ~/.config/hyprspace/switch-monitor-layout.sh 2', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']
