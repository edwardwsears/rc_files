# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color=0xffff9500 inactive_color=0x00000000 width=5.0'
]

# Start AeroSpace at login
start-at-login = false

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 20

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# The first three keys in each monitor row stay alive; the rest are on-demand.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = [
    '1', '2', '3',
    '11-q', '12-w', '13-e',
    '21-a', '22-s', '23-d',
]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 0
gaps.inner.vertical =   0
# Keep the 5pt JankyBorders stroke inside each monitor's visible frame.
gaps.outer.left =       5
gaps.outer.bottom =     5
gaps.outer.top =        5
gaps.outer.right =      5

# Workspace ownership follows keyboard rows regardless of display arrangement.
# Missing secondary or third displays fall back to the macOS main display.
[workspace-to-monitor-force-assignment]
'1' = 'main'
'2' = 'main'
'3' = 'main'
'4' = 'main'
'5' = 'main'
'6' = 'main'
'7' = 'main'
'8' = 'main'
'9' = 'main'
'10' = 'main'

'11-q' = ['^DELL SE2422HX$', 1, 'main']
'12-w' = ['^DELL SE2422HX$', 1, 'main']
'13-e' = ['^DELL SE2422HX$', 1, 'main']
'14-r' = ['^DELL SE2422HX$', 1, 'main']
'15-t' = ['^DELL SE2422HX$', 1, 'main']
'16-y' = ['^DELL SE2422HX$', 1, 'main']
'17-u' = ['^DELL SE2422HX$', 1, 'main']
'18-i' = ['^DELL SE2422HX$', 1, 'main']
'19-o' = ['^DELL SE2422HX$', 1, 'main']
'20-p' = ['^DELL SE2422HX$', 1, 'main']

'21-a' = ['^Built-in Retina Display$', 3, 'main']
'22-s' = ['^Built-in Retina Display$', 3, 'main']
'23-d' = ['^Built-in Retina Display$', 3, 'main']
'24-f' = ['^Built-in Retina Display$', 3, 'main']
'25-g' = ['^Built-in Retina Display$', 3, 'main']

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

  # Unmap the mac hide shortcut
  cmd-h = []       # Disable “Hide application”
  cmd-alt-h = []   # Optional: disable “Hide others”

  alt-space = 'exec-and-forget aerospace-workspace-switcher'
    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e \
    # 'tell application "Terminal" to tell (do script) to activate' '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    # Focus windows across visible monitors, then stop at the outer edge.
    # Focus windows directionally across monitor boundaries.
    alt-h = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail left || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-j = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail down || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-k = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail up || true', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-l = ['focus --boundaries all-monitors-outer-frame --boundaries-action fail right || true', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-pageDown = ['workspace --wrap-around next', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-pageUp = ['workspace --wrap-around prev', 'move-mouse window-force-center || move-mouse monitor-force-center']

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    # Each keyboard row owns a stable monitor. Only the first three workspaces
    # in each row are persistent; the rest are created on demand.
    alt-1 = ['workspace 1', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-2 = ['workspace 2', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-3 = ['workspace 3', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-4 = ['workspace 4', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-5 = ['workspace 5', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-6 = ['workspace 6', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-7 = ['workspace 7', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-8 = ['workspace 8', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-9 = ['workspace 9', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-0 = ['workspace 10', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-q = ['workspace 11-q', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-w = ['workspace 12-w', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-e = ['workspace 13-e', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-r = ['workspace 14-r', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-t = ['workspace 15-t', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-y = ['workspace 16-y', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-u = ['workspace 17-u', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-i = ['workspace 18-i', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-o = ['workspace 19-o', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-p = ['workspace 20-p', 'move-mouse window-force-center || move-mouse monitor-force-center']

    alt-a = ['workspace 21-a', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-s = ['workspace 22-s', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-d = ['workspace 23-d', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-f = ['workspace 24-f', 'move-mouse window-force-center || move-mouse monitor-force-center']
    alt-g = ['workspace 25-g', 'move-mouse window-force-center || move-mouse monitor-force-center']

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1', 'move-mouse window-force-center']
    alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2', 'move-mouse window-force-center']
    alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3', 'move-mouse window-force-center']
    alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4', 'move-mouse window-force-center']
    alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5', 'move-mouse window-force-center']
    alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6', 'move-mouse window-force-center']
    alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7', 'move-mouse window-force-center']
    alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8', 'move-mouse window-force-center']
    alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9', 'move-mouse window-force-center']
    alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10', 'move-mouse window-force-center']

    alt-shift-q = ['move-node-to-workspace 11-q', 'workspace 11-q', 'move-mouse window-force-center']
    alt-shift-w = ['move-node-to-workspace 12-w', 'workspace 12-w', 'move-mouse window-force-center']
    alt-shift-e = ['move-node-to-workspace 13-e', 'workspace 13-e', 'move-mouse window-force-center']
    alt-shift-r = ['move-node-to-workspace 14-r', 'workspace 14-r', 'move-mouse window-force-center']
    alt-shift-t = ['move-node-to-workspace 15-t', 'workspace 15-t', 'move-mouse window-force-center']
    alt-shift-y = ['move-node-to-workspace 16-y', 'workspace 16-y', 'move-mouse window-force-center']
    alt-shift-u = ['move-node-to-workspace 17-u', 'workspace 17-u', 'move-mouse window-force-center']
    alt-shift-i = ['move-node-to-workspace 18-i', 'workspace 18-i', 'move-mouse window-force-center']
    alt-shift-o = ['move-node-to-workspace 19-o', 'workspace 19-o', 'move-mouse window-force-center']
    alt-shift-p = ['move-node-to-workspace 20-p', 'workspace 20-p', 'move-mouse window-force-center']

    alt-shift-a = ['move-node-to-workspace 21-a', 'workspace 21-a', 'move-mouse window-force-center']
    alt-shift-s = ['move-node-to-workspace 22-s', 'workspace 22-s', 'move-mouse window-force-center']
    alt-shift-d = ['move-node-to-workspace 23-d', 'workspace 23-d', 'move-mouse window-force-center']
    alt-shift-f = ['move-node-to-workspace 24-f', 'workspace 24-f', 'move-mouse window-force-center']
    alt-shift-g = ['move-node-to-workspace 25-g', 'workspace 25-g', 'move-mouse window-force-center']

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = ['workspace-back-and-forth', 'move-mouse window-force-center || move-mouse monitor-force-center']
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']
